# Phase 6.4 — Rotation des logs du cycle RT (volume élevé en fenêtre METAR).
#
# Adapter le chemin absolu (WorkingDirectory du service) puis :
#   sudo cp deploy/logrotate/polymarket-bot-rt.conf /etc/logrotate.d/polymarket-bot-rt
#   sudo logrotate -d /etc/logrotate.d/polymarket-bot-rt
#
# Exemple utilisateur GCP (à remplacer) :
/home/social_content_check/polymarket-weather-bot/logs/update_bot_rt_cycle.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
}
